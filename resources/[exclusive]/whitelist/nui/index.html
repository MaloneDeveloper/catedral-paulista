<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
        integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
    <div id="container_login">
        <div class="content">
            <h1>para desbloquear A tela, você <br>
                precisa acessar nosso discord.</h1>
            <p>
                COPIE SEU ID, ACESSE NOSSO DISCORD, VÁ ATE A SALA <b>#LIBERAR-WL</b> E <b>ENVIE O <br>
                    ID COPIADO</b>, APÓS ISSO VOCÊ FICARÁ LIVRE DESTA TELA.
            </p>

            <div class="tutorial">
                <img class="opacity" src="images/no-wl.png" alt="">
                <svg class="animate" width="127" height="52" viewBox="0 0 127 52" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path class="svg" d="M0 26H122.5M122.5 26L98.5 2M122.5 26L98.5 50" stroke="white" stroke-width="5"
                        stroke-linecap="round" />
                </svg>

                <img class="opacity2" src="images/discord.png" alt="">
                <svg class="animate2" width="127" height="52" viewBox="0 0 127 52" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path class="svg" d="M0 26H122.5M122.5 26L98.5 2M122.5 26L98.5 50" stroke="white" stroke-width="5"
                        stroke-linecap="round" />
                </svg>

                <img class="opacity3" src="images/yes_wl.png" alt="">
            </div>

            <div class="token">
                <b>SEU ID:</b>
                <div class="copy">
                    <div class="code">1000</div>
                    <div class="click_copy">
                        <img src="images/copy.png" alt="">
                    </div>
                </div>
            </div>

            <div class="flex">
                <div class="button confirm" onclick="openNavigator()">
                    Acessar discord
                </div>
                <div class="button" onclick="confirm()">
                    Confirmar
                </div>
            </div>
            <div class="error">
                Você ainda não enviou seu id, ou enviou o id incorreto!
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
